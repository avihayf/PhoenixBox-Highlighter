plugins {
    id 'java'
}

// The single source of the release version: stamped into the JAR name and manifest, and shown in
// Burp, where PhoenixBox users confirm which version they have loaded.
version = '2.0.0'

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.2'
    testImplementation 'net.portswigger.burp.extensions:montoya-api:2026.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.22.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Compile against the Java 17 class library, not just its bytecode level, so a newer build JDK
// cannot let an API that Burp's runtime may lack slip through.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

tasks.processResources {
    inputs.property 'version', project.version
    filesMatching('phoenixbox-highlighter.properties') {
        expand(version: project.version)
    }
}

tasks.jar {
    archiveBaseName = 'PhoenixBoxHighlighter'
    manifest {
        attributes 'Implementation-Title': 'PhoenixBox Highlighter',
                   'Implementation-Version': project.version,
                   'Implementation-Vendor': '0xR3DB0MB'
    }
}

tasks.test {
    useJUnitPlatform()
}
